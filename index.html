    <!-- Global Error Handler for Mobile Debugging -->
    <script>
      // Catch all JavaScript errors
      window.addEventListener('error', function(event) {
        // Ignore generic "Script error" from cross-origin issues (not actionable)
        if (event.message === 'Script error.' && event.lineno === 0 && event.colno === 0 && !event.filename) {
          console.warn('⚠️ Cross-origin script error (harmless, ignoring)');
          return;
        }
        
        console.error('❌ GLOBAL ERROR:', {
          message: event.message,
          filename: event.filename,
          lineno: event.lineno,
          colno: event.colno,
          error: event.error ? event.error.stack : 'No stack trace'
        });
        
        // Only show error overlay for real errors (not generic cross-origin errors)
        var errorDiv = document.createElement('div');
        errorDiv.style.cssText = 'position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #1a1a1a; color: #ff6b6b; padding: 20px; font-family: monospace; font-size: 12px; overflow: auto; z-index: 999999;';
        errorDiv.innerHTML = '<h2 style="color: #ff6b6b; margin-top: 0;">JavaScript Error Detected</h2>' +
          '<p><strong>Message:</strong> ' + (event.message || 'Unknown error') + '</p>' +
          '<p><strong>File:</strong> ' + (event.filename || 'Unknown') + '</p>' +
          '<p><strong>Line:</strong> ' + (event.lineno || 'Unknown') + '</p>' +
          '<p><strong>Column:</strong> ' + (event.colno || 'Unknown') + '</p>' +
          '<pre style="background: #000; padding: 10px; border-radius: 5px; overflow: auto;">' + 
          (event.error && event.error.stack ? event.error.stack : 'No stack trace available') + 
          '</pre>' +
          '<p style="color: #888; margin-top: 20px;">Check Safari Web Inspector (Develop → Device → PocketTeller) for more details</p>' +
          '<button onclick="this.parentElement.remove()" style="margin-top: 20px; padding: 10px 20px; background: #ff6b6b; color: white; border: none; border-radius: 5px; cursor: pointer;">Dismiss</button>';
        document.body.appendChild(errorDiv);
      });
      
      // Catch unhandled promise rejections
      window.addEventListener('unhandledrejection', function(event) {
        console.error('❌ UNHANDLED PROMISE REJECTION:', event.reason);
      });
      
      console.log('🔍 Global error handlers installed');
    </script>
