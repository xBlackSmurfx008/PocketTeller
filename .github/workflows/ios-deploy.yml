name: iOS - Deploy to TestFlight

on:
  push:
    branches:
      - main
      - release/*
  workflow_dispatch:
    inputs:
      deployment_target:
        description: 'Deployment target'
        required: true
        default: 'testflight'
        type: choice
        options:
          - testflight
          - appstore

jobs:
  deploy-ios:
    name: Build and Deploy iOS App
    runs-on: macos-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Build Web App
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios
      
      - name: Install Fastlane
        run: |
          cd ios
          bundle install
      
      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_V43L3BZNA9.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_V43L3BZNA9.p8
      
      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install
      
      - name: Sync Capacitor
        run: npx cap sync ios
      
      - name: Configure Fastlane Environment
        run: |
          cd ios
          cat > .env << EOF
          APP_STORE_CONNECT_API_KEY_KEY_ID=V43L3BZNA9
          APP_STORE_CONNECT_API_KEY_ISSUER_ID=${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_V43L3BZNA9.p8
          FASTLANE_TEAM_ID=Z3L3NYSA9D
          FASTLANE_APP_IDENTIFIER=com.pocketteller.app
          FASTLANE_APPLE_ID=${{ secrets.APPLE_ID }}
          FASTLANE_SKIP_WAITING_FOR_BUILD_PROCESSING=true
          EOF
      
      - name: Deploy to TestFlight
        if: github.event.inputs.deployment_target == 'testflight' || github.event.inputs.deployment_target == ''
        run: |
          cd ios
          fastlane beta
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      
      - name: Deploy to App Store
        if: github.event.inputs.deployment_target == 'appstore'
        run: |
          cd ios
          fastlane release
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-logs
          path: |
            ios/fastlane/report.xml
            ios/fastlane/logs/
          retention-days: 30
      
      - name: Notify on Success
        if: success()
        run: |
          echo "✅ iOS app successfully deployed!"
          echo "Check App Store Connect for build status"
      
      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ iOS deployment failed!"
          echo "Check the logs for details"

